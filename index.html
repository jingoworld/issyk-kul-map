<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코스 지도 | 이식쿨 트레킹</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js"></script>
<link href="site.css?v=1" rel="stylesheet">
<style>
html,body{height:100%}
#app{display:grid;grid-template-columns:320px 1fr;grid-template-rows:1fr 196px;height:calc(100vh - var(--hdr));height:calc(100dvh - var(--hdr))}
#side{grid-row:1/3;border-right:1px solid var(--line);overflow:auto;padding:18px;background:#fff}
#mapbox{position:relative;min-height:0}
#map{position:absolute;inset:0}
#prof{border-top:1px solid var(--line);padding:10px 16px 8px;background:#fff;min-width:0;display:flex;flex-direction:column}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.tabs button{appearance:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 4px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.tabs button[aria-pressed=true]{color:#fff;border-color:transparent}
.tabs button[data-c=w][aria-pressed=true]{background:var(--w)}
.tabs button[data-c=fitz][aria-pressed=true]{background:var(--fitz)}
.tabs button[data-c=inca][aria-pressed=true]{background:var(--inca)}
.csub{font-size:13px;color:var(--sub);margin:0 0 12px;line-height:1.5}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.stat{background:#f5f6f8;border-radius:8px;padding:9px 11px}
.stat span{display:block;font-size:11.5px;color:var(--sub)}
.stat b{font-size:18px;letter-spacing:-.3px}
.cnote{font-size:12px;color:var(--sub);line-height:1.5;margin:0 0 14px}
#play{width:100%;appearance:none;border:0;border-radius:9px;background:var(--ink);color:#fff;font:inherit;font-weight:700;font-size:14.5px;padding:12px;cursor:pointer}
.ctl{display:flex;gap:6px;margin-top:6px}
.ctl button{flex:1;appearance:none;border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink)}
.ctl button[aria-pressed=true]{background:#eef1f5;font-weight:700}
#side h2{font-size:13.5px;margin:18px 0 6px}
#plist{list-style:none;margin:0;padding:0}
#plist button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:9px;width:100%;padding:7px 4px;border-bottom:1px solid #f0f1f3;font-size:13.5px;cursor:pointer}
#plist button:hover,#plist button:focus-visible{background:#f5f6f8}
#plist small{margin-left:auto;color:var(--sub);font-size:12px;white-space:nowrap}
.pin{width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #0005;flex:none}
.k-city{background:#1c1f23}.k-stay{background:#2a9d62}.k-pass{background:#c8102e}.k-lake{background:#1aa3c7}.k-peak{background:#5b3fb0}
.src{font-size:11px;color:var(--sub);line-height:1.55;margin-top:14px}
.ptop{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.ptop b{font-size:13.5px}
#readout{font-size:12.5px;color:var(--sub);margin-left:auto;font-variant-numeric:tabular-nums}
#chart{flex:1;min-height:0;width:100%;display:block;cursor:crosshair;touch-action:none}
.mk{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.mk .pin{width:15px;height:15px}
.mk .lb{margin-top:2px;background:#fffffff0;border-radius:4px;padding:1px 5px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 1px 2px #0003}
.mk.dim{opacity:.55}
#map.far .mk.sub .lb{display:none}
#map.playing .mk{visibility:hidden}
#cursor{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#ffd21f;border:3px solid #1c1f23;box-shadow:0 0 0 2px #fff;pointer-events:none;z-index:2;display:none;will-change:transform}
#layer{position:absolute;top:10px;left:10px;z-index:2;background:#fff;border:0;border-radius:7px;padding:7px 11px;font:inherit;font-size:12.5px;font-weight:700;box-shadow:0 1px 4px #0004;cursor:pointer}
.mapboxgl-popup-content{font-family:inherit;padding:10px 12px;max-width:240px;font-size:13px;line-height:1.5}
.mapboxgl-popup-content b{display:block;font-size:14px}
#err{display:none;position:absolute;inset:0;z-index:3;align-items:center;justify-content:center;background:#fff;padding:24px;text-align:center;color:var(--sub)}
@media (max-width:820px){
 #app{display:flex;flex-direction:column;height:auto}
 #mapbox{height:56vh;order:1}#prof{height:180px;order:2;flex:none}#side{order:3;border:0;grid-row:auto}
}
</style>
</head>
<body>
<header class="hdr"><a class="logo" href="index.html">두드림 이식쿨 트레킹</a><nav aria-label="주 메뉴"><a href="index.html" aria-current="page">코스 지도</a><a href="compare.html">일정 비교</a><a href="trip-6.html">6일 아라콜·이식쿨</a><a href="trip-9.html">9일 송쿨·아라콜</a></nav></header>
<div id="app">
 <aside id="side">
  <div class="tabs" role="group" aria-label="코스 선택">
   <button data-c="alakul" aria-pressed="true">아라콜 트레킹</button>
  </div>
  <p class="csub" id="csub"></p>
  <div class="stats" id="stats"></div>
  <p class="cnote" id="cnote"></p>
  <button id="play">▶ 트레일 미리보기</button>
  <div class="ctl">
   <button data-s="1" aria-pressed="true">보통</button>
   <button data-s="2" aria-pressed="false">빠르게</button>
   <button id="stop">처음으로</button>
  </div>
  <h2>주요 거점</h2>
  <ul id="plist"></ul>
  <p class="src">경로: OpenStreetMap 등산로를 BRouter로 연결했습니다. 고도는 지형 데이터 기준이라 공식 고도와 조금 다릅니다. 점선은 차량 이동입니다. 시로타와 켈디케 위치는 자료의 고도로 잡은 추정값입니다. 경로는 안내용입니다.</p>
 </aside>
 <div id="mapbox"><div id="map"></div><div id="cursor"></div><button id="layer">위성 지도</button><div id="err"></div></div>
 <section id="prof" aria-label="고도계">
  <div class="ptop"><b>고도계</b><span id="readout">그래프에 마우스를 올려 보세요</span></div>
  <svg id="chart" role="img" aria-label="코스 고도 그래프"></svg>
 </section>
</div>
<script src="config.js"></script>
<script src="data.js"></script>
<script>
const T=window.TREK, COLORS={alakul:'#d9601a'}, EX=1.3;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let cur='alakul', speed=1, prog=0, playing=false, last=0, satellite=false, cursorKm=null, intro=null;
const STYLES={o:'mapbox://styles/mapbox/outdoors-v12',s:'mapbox://styles/mapbox/satellite-streets-v12'};
const bounds=pts=>pts.reduce((b,p)=>b.extend(p),new mapboxgl.LngLatBounds(pts[0],pts[0]));

mapboxgl.accessToken=window.MAPBOX_TOKEN||'';
const map=new mapboxgl.Map({container:'map',style:STYLES.o,bounds:bounds(T.pois.map(p=>[p.lng,p.lat])),fitBoundsOptions:{padding:50},pitch:45,antialias:true});
map.addControl(new mapboxgl.NavigationControl({visualizePitch:true}),'top-right');
map.addControl(new mapboxgl.ScaleControl({unit:'metric'}),'bottom-left');
map.on('error',e=>{const m=String(e.error&&e.error.message||'');if(/401|403|Forbidden|Unauthorized|access token/i.test(m)){const x=$('#err');x.style.display='flex';x.textContent='지도를 불러오지 못했습니다. 맵박스 토큰의 허용 주소를 확인해 주세요.';}});

function addLayers(){
 if(!map.getSource('dem')) map.addSource('dem',{type:'raster-dem',url:'mapbox://mapbox.mapbox-terrain-dem-v1',tileSize:512,maxzoom:14});
 map.setTerrain({source:'dem',exaggeration:EX});
 map.setFog({range:[1,12],color:'#f5f7fa','horizon-blend':.08});
 map.addSource('jeep',{type:'geojson',data:{type:'FeatureCollection',features:T.jeep.map(c=>({type:'Feature',geometry:{type:'LineString',coordinates:c}}))}});
 map.addLayer({id:'jeep',type:'line',source:'jeep',layout:{'line-cap':'round'},paint:{'line-color':'#59616c','line-width':2.5,'line-dasharray':[1.5,1.8]}});
 for(const [k,c] of Object.entries(T.courses)){
  map.addSource('t-'+k,{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:c.track.map(p=>[p[0],p[1]])}}});
  map.addLayer({id:'h-'+k,type:'line',source:'t-'+k,layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#fff','line-width':8,'line-opacity':.9}});
  map.addLayer({id:'l-'+k,type:'line',source:'t-'+k,layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':COLORS[k],'line-width':4.5}});
 }
 // 미리보기 중에는 화면 요소(DOM) 대신 지도 안에 그린 거점을 써서 떨리지 않게 한다
 map.addSource('poi',{type:'geojson',data:{type:'FeatureCollection',features:T.pois.map(p=>({type:'Feature',properties:{name:p.name},geometry:{type:'Point',coordinates:[p.lng,p.lat]}}))}});
 map.addLayer({id:'poi-c',type:'circle',source:'poi',layout:{visibility:'none'},paint:{'circle-radius':6,'circle-color':'#fff','circle-stroke-color':'#1c1f23','circle-stroke-width':2.5,'circle-pitch-alignment':'map'}});
 map.addLayer({id:'poi-t',type:'symbol',source:'poi',layout:{visibility:'none','text-field':['get','name'],'text-size':13,'text-offset':[0,1.1],'text-anchor':'top','text-font':['DIN Pro Medium','Arial Unicode MS Regular']},paint:{'text-color':'#1c1f23','text-halo-color':'#fff','text-halo-width':1.6}});
 paintActive();setPoiLayers();
}
map.on('style.load',addLayers);
function setPoiLayers(){for(const l of ['poi-c','poi-t'])if(map.getLayer(l))map.setLayoutProperty(l,'visibility',playing?'visible':'none');$('#map').classList.toggle('playing',playing);}
function paintActive(){
 for(const k of Object.keys(T.courses)) if(map.getLayer('l-'+k)){
  map.setPaintProperty('l-'+k,'line-opacity',k===cur?1:.55);
  map.setPaintProperty('l-'+k,'line-width',k===cur?5:3.5);
 }
}
// 마커
const POIM={};
for(const p of T.pois){
 const el=document.createElement('div');el.className='mk'+(p.sub?' sub':'');
 el.innerHTML=`<span class="pin k-${p.kind}"></span><span class="lb">${p.name}</span>`;
 const pop=new mapboxgl.Popup({offset:18,closeButton:false}).setHTML(`<b>${p.name}</b>${p.ele?`해발 약 ${p.ele.toLocaleString('ko-KR')}m<br>`:''}${p.text}`);
 const m=new mapboxgl.Marker({element:el,anchor:'top'}).setLngLat([p.lng,p.lat]).setPopup(pop).addTo(map);
 const li=document.createElement('li');POIM[p.id]={p,m,el,li};
 li.innerHTML=`<button><span class="pin k-${p.kind}"></span>${p.name}<small>${p.ele?p.ele.toLocaleString('ko-KR')+'m':''}</small></button>`;
 li.firstChild.onclick=()=>{stopPlay();map.flyTo({center:[p.lng,p.lat],zoom:p.kind==='city'?10:13,pitch:50,duration:1400});m.togglePopup();};
 $('#plist').append(li);
}
const zoomLabels=()=>$('#map').classList.toggle('far',map.getZoom()<10.6);map.on('zoom',zoomLabels);zoomLabels();

// 코스 계산
const track=()=>T.courses[cur].track, total=()=>{const t=track();return t[t.length-1][3]};
function at(km){
 const t=track();km=Math.max(0,Math.min(km,total()));
 let lo=0,hi=t.length-1;
 while(hi-lo>1){const m=(lo+hi)>>1;if(t[m][3]<=km)lo=m;else hi=m;}
 const a=t[lo],b=t[hi],f=b[3]>a[3]?(km-a[3])/(b[3]-a[3]):0;
 return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f];
}
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
function placeCursor(){
 const c=$('#cursor');if(cursorKm==null){c.style.display='none';return;}
 const p=at(cursorKm),q=map.project([p[0],p[1]]);c.style.display='block';
 c.style.transform=`translate3d(${q.x.toFixed(2)}px,${q.y.toFixed(2)}px,0)`;
}
map.on('render',placeCursor);
function showCursor(km){
 cursorKm=km;const p=at(km);placeCursor();
 $('#readout').textContent=`${km.toFixed(1)} km · 해발 ${fmt(p[2])} m`;
 drawCursor(km);
}
// 고도계
const NS='http://www.w3.org/2000/svg';const svg=$('#chart');let X,Y,CW,CH;const PAD={l:44,r:12,t:18,b:18};
function node(n,a,t){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;svg.append(e);return e;}
function drawChart(){
 const r=svg.getBoundingClientRect();CW=r.width;CH=r.height;if(!CW||!CH)return;
 svg.setAttribute('viewBox',`0 0 ${CW} ${CH}`);svg.replaceChildren();
 const c=T.courses[cur],t=c.track,max=total();
 const lo=Math.floor(c.stats.min/500)*500,hi=Math.ceil((c.stats.max+60)/500)*500;
 X=k=>PAD.l+k/max*(CW-PAD.l-PAD.r);Y=e=>PAD.t+(hi-e)/(hi-lo)*(CH-PAD.t-PAD.b);
 for(let e=lo;e<=hi;e+=500){node('line',{x1:PAD.l,x2:CW-PAD.r,y1:Y(e),y2:Y(e),stroke:'#e9ebee'});node('text',{x:PAD.l-6,y:Y(e)+4,'text-anchor':'end','font-size':11,fill:'#667080'},fmt(e));}
 const step=max>40?10:max>12?5:2;for(let k=0;k<=max;k+=step)node('text',{x:X(k),y:CH-4,'text-anchor':'middle','font-size':11,fill:'#667080'},k+' km');
 const d='M'+t.map(p=>`${X(p[3]).toFixed(1)} ${Y(p[2]).toFixed(1)}`).join('L');
 node('path',{d:`${d}L${X(max)} ${CH-PAD.b}L${X(0)} ${CH-PAD.b}Z`,fill:COLORS[cur],'fill-opacity':.16});
 node('path',{d,fill:'none',stroke:COLORS[cur],'stroke-width':2});
 for(const q of c.cuts){const p=at(q.km),x=X(q.km),anc=q.km<max*.08?'start':q.km>max*.92?'end':'middle';
  node('line',{x1:x,x2:x,y1:Y(p[2]),y2:CH-PAD.b,stroke:'#59616c','stroke-dasharray':'2 3'});
  node('circle',{cx:x,cy:Y(p[2]),r:3.5,fill:'#fff',stroke:'#1c1f23','stroke-width':1.5});
  node('text',{x,y:Math.max(11,Y(p[2])-7),'text-anchor':anc,'font-size':11.5,'font-weight':700,fill:'#1c1f23'},q.name);}
 node('line',{id:'cl',x1:0,x2:0,y1:PAD.t,y2:CH-PAD.b,stroke:'#1c1f23',visibility:'hidden'});
 node('circle',{id:'cd',r:5,fill:'#ffd21f',stroke:'#1c1f23','stroke-width':2,visibility:'hidden'});
}
function drawCursor(km){const l=$('#cl'),d=$('#cd');if(!l)return;const p=at(km),x=X(km);
 l.setAttribute('x1',x);l.setAttribute('x2',x);l.setAttribute('visibility','visible');d.setAttribute('cx',x);d.setAttribute('cy',Y(p[2]));d.setAttribute('visibility','visible');}
function kmFrom(ev){const r=svg.getBoundingClientRect();return Math.max(0,Math.min(total(),(ev.clientX-r.left-PAD.l)/(CW-PAD.l-PAD.r)*total()));}
svg.addEventListener('pointermove',e=>{if(playing)return;showCursor(kmFrom(e));});
svg.addEventListener('pointerdown',e=>{const k=kmFrom(e);prog=k/total();showCursor(k);if(!playing){const p=at(k);map.easeTo({center:[p[0],p[1]],duration:500});}});
new ResizeObserver(()=>{drawChart();if(cursorKm!=null)drawCursor(cursorKm);}).observe(svg);

// 코스 선택
function selectCourse(k,fly=true){
 stopPlay();cur=k;prog=0;cursorKm=null;path=null;const c=T.courses[k];
 $$('.tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===k));
 $('#csub').textContent=c.sub;$('#cnote').textContent=c.note;
 const s=c.stats;$('#stats').innerHTML=[['걷는 거리',s.km+' km'],['최고 고도',fmt(s.max)+' m'],['오르막',fmt(s.up)+' m'],['내리막',fmt(s.dn)+' m']].map(([a,b])=>`<div class="stat"><span>${a}</span><b>${b}</b></div>`).join('');
 for(const {p,el,li} of Object.values(POIM)){el.classList.toggle('dim',!!p.course&&p.course!==k);li.hidden=p.course?p.course!==k:k==='inca';}
 $('#readout').textContent='그래프에 마우스를 올려 보세요';
 placeCursor();drawChart();paintActive();
 if(fly)fitCourse();
}
function fitCourse(){map.fitBounds(bounds(track().map(p=>[p[0],p[1]])),{padding:{top:70,bottom:60,left:60,right:60},pitch:50,bearing:0,duration:1500});}
$$('.tabs button').forEach(b=>b.onclick=()=>selectCourse(b.dataset.c));

// 트레일 미리보기: 카메라 경로를 먼저 다 계산해 두고 거리로 읽는다
const STEP=.05, PITCH=62, ABOVE=1500, BACK=2.6, secPerKm=()=>total()>40?1.6:3.2;
let path=null;
const RAD=Math.PI/180, smoothArr=(a,w)=>{const o=new Array(a.length),n=a.length;let s=0;const pre=[0];for(const v of a){s+=v;pre.push(s);}for(let i=0;i<n;i++){const l=Math.max(0,i-w),r=Math.min(n,i+w+1);o[i]=(pre[r]-pre[l])/(r-l);}return o;};
function buildPath(){
 const n=Math.ceil(total()/STEP)+1,km=[...Array(n)].map((_,i)=>Math.min(i*STEP,total()));
 const pts=km.map(at),kx=Math.cos(pts[0][1]*RAD);
 const gx=[],gy=[];for(let i=0;i<n;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];const dx=(b[0]-a[0])*kx,dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;gx.push(dx/l);gy.push(dy/l);}
 const w=Math.round(1.1/STEP);
 const sx=smoothArr(smoothArr(gx,w),w),sy=smoothArr(smoothArr(gy,w),w);
 const bear=sx.map((x,i)=>Math.atan2(x,sy[i]));
 const backDeg=BACK/111.32;
 const clng=pts.map((p,i)=>p[0]-Math.sin(bear[i])*backDeg/kx),clat=pts.map((p,i)=>p[1]-Math.cos(bear[i])*backDeg);
 const win=Math.round(1.5/STEP),hi=pts.map((_,i)=>{let m=0;for(let j=Math.max(0,i-win);j<=Math.min(n-1,i+win);j++)m=Math.max(m,pts[j][2]);return m*EX+ABOVE;});
 const sw=Math.round(.6/STEP),cx=smoothArr(clng,sw),cy=smoothArr(clat,sw),ca=smoothArr(smoothArr(hi,win),win);
 let bdeg=[],prev=bear[0]/RAD;for(const b of bear){let d=b/RAD;while(d-prev>180)d-=360;while(d-prev<-180)d+=360;bdeg.push(d);prev=d;}
 bdeg=smoothArr(bdeg,sw);
 path={cx,cy,ca,bdeg};
}
function pose(km){
 const f=Math.min(km/STEP,path.cx.length-1.001),i=Math.floor(f),t=f-i,L=a=>a[i]+(a[i+1]-a[i])*t;
 return {lng:L(path.cx),lat:L(path.cy),alt:L(path.ca),bearing:L(path.bdeg),pitch:PITCH};
}
function applyPose(c){
 const o=map.getFreeCameraOptions();
 o.position=mapboxgl.MercatorCoordinate.fromLngLat([c.lng,c.lat],c.alt);
 o.setPitchBearing(c.pitch,c.bearing);
 map.setFreeCameraOptions(o);
}
function setPlay(v){playing=v;$('#play').textContent=v?'❚❚ 일시정지':(prog>0&&prog<1?'▶ 이어서 보기':'▶ 트레일 미리보기');setPoiLayers();}
function stopPlay(){intro=null;setPlay(false);}
function frame(t){
 if(!playing)return;
 const dt=Math.min(100,t-last);last=t;
 if(intro){
  intro.t+=dt/1400;const e=Math.min(1,intro.t),s=e*e*(3-2*e),a=intro.a,b=intro.b;
  let db=b.bearing-a.bearing;while(db>180)db-=360;while(db<-180)db+=360;
  applyPose({lng:a.lng+(b.lng-a.lng)*s,lat:a.lat+(b.lat-a.lat)*s,alt:a.alt+(b.alt-a.alt)*s,bearing:a.bearing+db*s,pitch:a.pitch+(b.pitch-a.pitch)*s});
  if(e>=1)intro=null;
  requestAnimationFrame(frame);return;
 }
 prog+=dt/1000*speed/(secPerKm()*total());
 if(prog>=1){prog=1;showCursor(total());setPlay(false);setTimeout(()=>{prog=0;cursorKm=null;placeCursor();drawChart();$('#readout').textContent='그래프에 마우스를 올려 보세요';fitCourse();$('#play').textContent='▶ 트레일 미리보기';},900);return;}
 const k=prog*total();applyPose(pose(k));showCursor(k);requestAnimationFrame(frame);
}
function startPlay(){
 if(!path)buildPath();
 const k=prog*total(),cam=map.getFreeCameraOptions(),ll=cam.position.toLngLat();
